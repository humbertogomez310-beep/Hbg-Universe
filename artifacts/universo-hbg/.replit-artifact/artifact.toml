kind = "web"
previewPath = "/"
title = "UNIVERSO HBG"
version = "1.0.0"
id = "artifacts/universo-hbg"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22538

[services.development]
run = "pnpm --filter @workspace/universo-hbg run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/universo-hbg", "run", "build" ]
publicDir = "artifacts/universo-hbg/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22538"
BASE_PATH = "/"
