name: HBG Universe CI

on:
  push:
    branches:
      - replit-agent
      - local-first/**
  pull_request:
    branches:
      - main
      - replit-agent
      - local-first/**

permissions:
  contents: read

concurrency:
  group: hbg-universe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hbg_universe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hbg_universe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hbg_universe_test
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision isolated test schema
        run: |
          pnpm --filter @workspace/db migrate

      - name: Validate deployment and PWA scripts
        run: |
          node --check artifacts/universo-hbg/public/sw.js
          node -e "const fs=require('node:fs'); const root='artifacts/universo-hbg/public'; const manifest=JSON.parse(fs.readFileSync(root+'/manifest.webmanifest','utf8')); for (const icon of manifest.icons ?? []) { if (!fs.existsSync(root + icon.src)) throw new Error('Missing PWA icon: ' + icon.src); } if (!fs.existsSync(root+'/apple-touch-icon.png')) throw new Error('Missing iOS apple-touch-icon.png');"
          bash -n scripts/post-merge.sh

      - name: Run API server tests
        run: pnpm --filter @workspace/api-server test

      - name: Run Universo HBG application tests
        run: pnpm --filter @workspace/universo-hbg test

      - name: Typecheck the workspace
        run: pnpm typecheck

      - name: Build production workspace
        run: pnpm build

      - name: Build static Local-first PWA
        run: |
          VITE_HBG_API_ENABLED=false pnpm --dir artifacts/universo-hbg run build
          test -f artifacts/universo-hbg/dist/public/index.html
          test -f artifacts/universo-hbg/dist/public/sw.js
          test -f artifacts/universo-hbg/dist/public/manifest.webmanifest
          test -f artifacts/universo-hbg/dist/public/_headers
